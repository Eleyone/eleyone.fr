    lands_in: "epic-9-retro-item-57 (open) ; l'arbitrage d'Arnaud décide si ça devient
      une story"
  - id: "epic-9-oq-controle-contre-une-liste-recopiee"
    epic: 9
    question: "Faut-il un contrôle qui refuse une énumération de noms HUGO_LEGAL_*
      hors de scripts/env.sh ?"
    state: "La liste recopiée est toujours en place (scripts/checks/content.sh:297).
      epic-9-retro-item-55 corrige cette instance mais ne tranche pas la question
      du contrôle."
    lands_in: "arbitrage d'Arnaud — un contrôle de plus contre une classe de faute
      déjà vue trois fois, ou la règle seule ?"

  - id: "epic-11-oq-valeurs-legales-dans-le-depot"
    epic: 11
    question: "Les huit HUGO_LEGAL_* doivent-elles rester injectées au build, alors
      qu'elles sont toutes affichées sur les mentions légales et donc publiques par
      construction ?"
    state: "Posée par Arnaud le 25/09/2026, pendant la story 11.3. Vérifié : les huit
      valeurs sont bien rendues par « legal-list » sur les deux pages légales (éditeur
      — nom, adresse, courriel, téléphone, immatriculation ; hébergeur — nom, adresse,
      courriel). Six sont sans enjeu ; deux seulement sont sensibles, la commune de
      résidence et le téléphone. Trois différences séparent « public sur le site »
      de « public dans le dépôt » : l'historique git ne s'efface pas alors qu'une
      page se redéploie, un fichier de dépôt public est scrapé par les agrégateurs,
      et commiter ces valeurs supposerait de les retirer de forbidden-patterns.txt
      — ce qui cesserait de les attraper partout ailleurs, et prive C22 du point de
      référence qui lui fait distinguer l'occurrence légitime de la fuite. Arbitrage
