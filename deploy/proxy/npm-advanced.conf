# Directives de l'hôte proxy du site dans Nginx Proxy Manager (AD-15, story 11.11).
# Recopiées de l'interface de NPM pour la traçabilité : NPM les garde dans sa base, pas dans ce
# dépôt, et réécrit sa configuration à chaque sauvegarde. Aucun nom d'hôte ni adresse ici (NFR-9).
#
# Réglages de l'hôte (onglet Details) :
#   Scheme http, Forward Hostname « site », Forward Port 80 — le service Compose du canal de
#   production, sur le réseau du proxy (deploy/compose.yaml).
#   Cache Assets : désactivé — sa location par expression régulière ne passerait pas par la
#   Custom Location « / », et journaliserait les fichiers statiques.
#   Websockets : désactivé. Access List : publique.
#   SSL : certificat Let's Encrypt, Force SSL et HSTS, posés après le DNS.
#
# Jamais de bloc « location / { … } » dans l'onglet Advanced : NPM ne générerait plus son
# proxy_pass. Jamais d'édition de /data/nginx/proxy_host/<id>.conf : réécrit à chaque sauvegarde.

# Deux blocs, deux champs de NPM : chacun se copie **tel quel, sans retirer ni ajouter de « # »**,
# dans le champ que son titre nomme. Les lignes de titre et d'explication sont des commentaires
# nginx, sans effet si elles sont collées avec.

# ===== BLOC 1 — onglet « Advanced » de l'hôte (niveau server) =================================
# « off » annule tous les access_log du même niveau, dont celui que NPM déclare au format
# « proxy » ([Client $remote_addr], user-agent, referer). Couvre aussi la redirection HTTP→HTTPS.
access_log off;
# ===== fin du bloc 1 ==========================================================================

# ===== BLOC 2 — Custom Location « / », même destination (site:80), champ avancé (roue dentée) =
# Coupe le journal d'accès et, pour les requêtes servies par cette location, le journal d'erreurs
# (l'error_log « warn » que NPM pose au niveau server, avec l'IP du client, n'y est plus atteint).
access_log off;
error_log /dev/null crit;
# ===== fin du bloc 2 ==========================================================================
