# Configuration du serveur qui sert le site (AD-13, AD-15). Elle vit dans l'image, avec le site ;
# TLS, HSTS et la redirection HTTPS relèvent du reverse proxy, pas d'ici.
# Procédure : docs/procedures/build-image.md

# La CSP n'est envoyée que sur le HTML : les schémas D2 portent des <style> et des polices
# embarquées, qu'une politique « style-src 'self' » casserait. Une valeur vide supprime l'en-tête.
map $sent_http_content_type $csp {
    ~^text/html  "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    default      "";
}

# Cache selon ce qui est servi, et non selon l'emplacement :
#   - un fichier empreinté d'un condensat ne change jamais de contenu sous le même nom : un an ;
#   - tout le reste — HTML, PDF, images non empreintées — est revérifié à chaque visite. Le
#     navigateur ne retransfère rien si rien n'a changé, et une photo remplacée est vue tout de
#     suite (décidé par Arnaud le 21/09/2026).
map $uri $cache_control {
    # La regex est entre guillemets : sans eux, nginx lit les accolades de « {64} » comme un bloc.
    "~\.[0-9a-f]{64}\.(css|svg|webp)$"  "public, max-age=31536000, immutable";
    default                            "no-cache";
}

# Journal sans adresse IP, sans chaîne de requête, sans user-agent et sans referer (NFR-3, FR-19) :
# date, méthode, chemin, statut, taille. « $uri » et non « $request », qui porterait la chaîne de
# requête. Comme les « map », « log_format » appartient au contexte http et se déclare hors du server.
log_format sans_ip '[$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ni version dans les réponses, ni adresse absolue dans les redirections — derrière un proxy,
    # une adresse absolue renverrait vers le port du conteneur —, ni bruit sur les fichiers absents.
    server_tokens off;
    absolute_redirect off;
    log_not_found off;

    access_log /dev/stdout sans_ip;
    error_log /dev/stderr crit;

    # « merge » : sans lui, un add_header dans un location effacerait tous ceux du server
    # (directive vérifiée dans l'image servie, nginx 1.30.4).
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    # « text/xml » autant qu'« application/xml » : nginx sert un .xml en text/xml, et la liste ne le
    # couvrait pas — le sitemap partait non compressé (constaté au premier essai du conteneur).
    gzip_types text/css text/xml image/svg+xml application/json application/xml application/rss+xml;
    # text/html est toujours compressé par nginx et ne se déclare pas ici.
    # Le seuil par défaut est de 20 octets : un fichier plus court part tel quel, ce qui est voulu.

    error_page 404 /404.html;

    location /en/ {
        error_page 404 /en/404.html;
    }
}
