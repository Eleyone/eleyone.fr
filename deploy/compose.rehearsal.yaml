# Canal de répétition, sur le serveur de production mais séparé de lui (story 11.4, AD-22, AD-15).
#
# Ce que la répétition doit prouver, c'est la chaîne entière — image, envoi, commande forcée, retour
# arrière — **sans** toucher au service de production, à l'hôte proxy ni au DNS. D'où les deux seules
# différences avec deploy/compose.yaml :
#
#   - le projet s'appelle « site-rehearsal » : ses conteneurs, ses volumes et son réseau par défaut
#     sont à lui, et un « down » ici ne peut pas atteindre ceux de la production ;
#   - le conteneur est **hors du réseau du proxy** — aucune section « networks » ne le rejoint, donc
#     Compose lui crée le réseau par défaut du projet — et il est publié **sur la boucle locale
#     seulement**, en 127.0.0.1:18080. Aucun DNS, aucun hôte proxy, aucun port public : la vérification
#     passe par un tunnel SSH depuis le poste (AD-22).
#
# Tout le reste est identique à la production, et c'est voulu : une répétition qui journaliserait
# autrement ne prouverait pas ce qu'elle prétend prouver. Le « :? » de SITE_TAG y compris.
#
# Procédure : docs/procedures/deploy-site.md
name: site-rehearsal

services:
  site:
    # La valeur est entre guillemets : le message du « :? » contient un « , » et pouvait contenir
    # un « : », que le lecteur YAML lirait comme un début de clé (vérifié, « docker compose config »).
    image: "eleyone-site:${SITE_TAG:?SITE_TAG absente, le tag de l'image se pose par deploy-site.sh}"
    restart: unless-stopped
    # L'adresse est dans la valeur, pas seulement le port : « 18080:80 » écouterait sur toutes les
    # interfaces du serveur, et la répétition serait publique le temps qu'elle dure.
    ports:
      - "127.0.0.1:18080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
