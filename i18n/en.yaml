# Legal notice (AD-9, FR-18, story 9.1). Les formes anglaises sont **attestées** sur des pages
# institutionnelles françaises en anglais (lafrenchtech.gouv.fr/en/legal-notices/,
# france-science.com/en/legal-notice/), et non traduites au jugé.
# Deux pièges évités : « Legal mentions » est un calque très répandu qui n'est pas de l'anglais
# juridique, et « Editor » est un faux ami — en anglais c'est le rédacteur en chef, quand l'éditeur
# au sens de la LCEN est le « publisher ».
