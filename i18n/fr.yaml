# Liens vers les CV PDF (AD-21, story 7.2). Même construction dans les deux langues, harmonisée
# sur la forme anglaise (arbitrage d'Arnaud du 22/09/2026). L'espace avant l'unité est insécable :
# un poids ne se coupe pas en fin de ligne.
cv_pdf: "CV (PDF, {{ .Language }}, {{ .Size }} Ko)"
cv_language_fr: français
cv_language_en: anglais

# Mentions légales (AD-9, FR-18, story 9.1). Les intitulés viennent des formulations usuelles des
# pages françaises ; aucun n'est imposé par la loi, qui ne régit que le contenu.
# « Directeur de la publication » est en revanche le vocabulaire de l'article 93-2 de la loi
# n° 82-652, auquel l'article 1-1 I 3° de la LCEN renvoie : s'en écarter serait s'écarter du texte.
# Titres des trois groupes (DESIGN.md § legal-list : « trois groupes en section-heading »).
legal_publication_director: Directeur de la publication
# Termes de la liste de définitions, dans la marge dès md.
legal_term_name: Nom
legal_term_address: Adresse
legal_term_email: Contact
legal_term_phone: Téléphone
legal_term_registration: Immatriculation
footer_legal_notice: Mentions légales
footer_privacy: Confidentialité

# Page Contact et appel à contact sur l'accueil (FR-3, FR-17, story 9.3).
# « Me contacter » / « Get in touch » : libellés validés par Arnaud le 23/09/2026, qu'EXPERIENCE.md
# portait « à valider » depuis le 13/09. « Courriel » suit DESIGN.md § Contact.
nav_contact: Contact
block_contact: Contact
contact_cta: Me contacter
